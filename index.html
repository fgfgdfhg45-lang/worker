<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كشف قبضي</title>
<meta name="theme-color" content="#16235c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{--navy:#16235c;--navy-deep:#0d1740;--orange:#f3941e;--bg:#f1f3f8;--line:#e2e5f0;--muted:#6b7290;--warn:#c0392b;--good:#1f8a5f}
  *{box-sizing:border-box} body{margin:0;font-family:Tahoma,'Segoe UI',sans-serif;background:var(--bg);color:#1c2240}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--navy-deep));padding:20px}
  .box{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:380px;text-align:center}
  .box h2{margin:0 0 16px;color:var(--navy)}
  input{width:100%;padding:11px 12px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;direction:ltr;text-align:center}
  button{border:none;border-radius:9px;padding:11px 16px;font-weight:bold;cursor:pointer;font-size:14px}
  .go{width:100%;background:var(--orange);color:#1c1300}
  .lnk{background:none;color:var(--muted);font-size:12px;text-decoration:underline;margin-top:10px}
  #msg{margin-top:10px;font-size:12.5px;color:var(--warn);min-height:16px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .out{background:var(--navy);color:#fff}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
  .card h3{margin:0 0 10px;color:var(--navy);font-size:15px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .ln{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .ln.minus b{color:var(--warn)} .ln.plus b{color:var(--good)}
  .me{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
  .me .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--orange);flex:none}
  .me .nm{font-weight:bold;color:var(--navy);font-size:16px}
  .me .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .pc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 8px rgba(22,35,92,.06)}
  .pc-head{background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--orange);gap:8px}
  .pc-head .wn{font-size:17px;font-weight:bold}
  .pc-head .ws{font-size:12px;opacity:.85;white-space:nowrap}
  .pc-body{padding:10px 18px 14px}
  .pc-body .ln:last-of-type{border-bottom:none}
  .ln .l{color:var(--muted)} .ln .v{font-weight:bold;direction:ltr}
  .ln.zero .v{color:#9aa0b8;font-weight:normal}
  .gt{margin-top:8px;padding-top:12px;border-top:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--navy);font-weight:bold}
  .gt .big{font-size:24px}
  .pc-foot{background:#f6f7fb;padding:9px 16px;font-size:11px;color:var(--muted);text-align:center;border-top:1px solid var(--line);line-height:1.7}
  .logo-wrap{position:relative;width:150px;height:150px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
  .logo-wrap img{width:116px;height:116px;border-radius:50%;object-fit:cover;position:relative;z-index:2;box-shadow:0 6px 20px rgba(22,35,92,.25);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
  .logo-wrap .ring{position:absolute;inset:6px;border-radius:50%;border:3px solid transparent;border-top-color:var(--orange);border-right-color:var(--orange);animation:spin 3s linear infinite}
  .logo-wrap .ring.r2{inset:0;border-top-color:transparent;border-right-color:transparent;border-bottom-color:var(--navy);border-left-color:var(--navy);opacity:.35;animation-duration:5s;animation-direction:reverse}
  .logo-wrap .pulse{position:absolute;inset:14px;border-radius:50%;background:var(--orange);opacity:.25;animation:pulse 2.4s ease-out infinite}
  .coins{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .coins i{position:absolute;bottom:-40px;font-style:normal;font-weight:bold;color:rgba(243,148,30,.55);opacity:0;animation:rise 6s linear infinite}
  .login{position:relative;overflow:hidden}
  .login .box{position:relative;z-index:2}
  .app-logo{text-align:center;margin-bottom:6px}
  .app-logo .logo-wrap{width:108px;height:108px;margin-bottom:0}
  .app-logo .logo-wrap img{width:80px;height:80px}
  .app-logo .logo-wrap .pulse{inset:10px}
  .app-logo .co{font-size:13px;color:var(--navy);font-weight:bold;margin-top:2px}
  .pc{animation:up .5s ease both}
  .pc:nth-of-type(2){animation-delay:.1s}.pc:nth-of-type(3){animation-delay:.2s}
  .me{animation:up .5s ease both}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%{transform:scale(.9);opacity:.35}100%{transform:scale(1.45);opacity:0}}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes up{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:.9}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .notice{background:#fff8ec;border:1px solid #f6d9a8;border-right:5px solid var(--orange);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13.5px;line-height:1.8;color:#5a3d06;animation:up .5s ease both}
  .notice b{color:var(--navy)}
  .cal{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;animation:up .5s ease both}
  .cal h3{margin:0 0 4px;color:var(--navy);font-size:15px}
  .cal .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-grid .dn{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
  .cal-grid button.d,.cal-grid .e{aspect-ratio:1;border-radius:10px}
  .cal-grid button.d{padding:0;font-size:14px;font-weight:bold;border:1.5px solid transparent;background:#f3f4f9;color:#9aa0b8;transition:transform .12s}
  .cal-grid button.d:active{transform:scale(.92)}
  .cal-grid button.d.p{background:#e3f5ec;color:var(--good);border-color:#b9e4cf}
  .cal-grid button.d.l{background:#fff1dc;color:#b86a00;border-color:#f6d9a8}
  .cal-grid button.d.a{background:#fde8e5;color:var(--warn);border-color:#f5beb8}
  .cal-grid button.d.h{background:#e6edff;color:#2c4fb8;border-color:#c3d2fb}
  .cal-grid button.d.f{background:#eef0f5;color:#8a90a8}
  .cal-grid button.d.today{box-shadow:0 0 0 2px var(--navy)}
  .cal-grid button.d.sel{outline:3px solid var(--orange);outline-offset:1px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:11.5px;color:var(--muted)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-left:4px;vertical-align:-1px}
  .dayinfo{margin-top:12px;background:#f6f7fb;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.9;min-height:46px;color:#1c2240}
  .dayinfo .t{font-weight:bold;color:var(--navy);margin-bottom:2px}
  .wa-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 16px;animation:up .5s ease both}
  .wa-card h3{margin:0 0 6px;color:var(--navy);font-size:15px}
  .wa-card p{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.8}
  .wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;text-decoration:none;font-weight:bold;font-size:15px;border-radius:12px;padding:12px 16px}
  .wa-btn:active{transform:scale(.98)}
  .wa-btn svg{width:26px;height:26px;fill:#fff;flex:none}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
  .chips button{background:#fff;border:1.5px solid var(--line);color:var(--navy);white-space:nowrap;border-radius:20px;padding:8px 14px;font-size:13px}
  .chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .sum div{background:#f6f7fb;border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted)}
  .sum b{display:block;font-size:15px;color:var(--navy);margin-bottom:2px}
  .acts{display:flex;gap:8px;margin-bottom:16px}
  .acts button{flex:1;background:var(--navy);color:#fff}
  .acts button.o{background:var(--orange);color:#1c1300}
  .mdl{position:fixed;inset:0;background:rgba(13,23,64,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .mdl .box{max-width:340px}
  .inst{background:#e6edff;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:none;align-items:center;justify-content:space-between;gap:8px}
  .snap,.snap *{animation:none!important}
  .spin{width:28px;height:28px;margin:14px auto 2px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin .9s linear infinite}
  .ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
  .top .btns{display:flex;gap:8px;align-items:center}
  .ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;background:var(--navy);color:#fff}
  .ibtn .ic{width:19px;height:19px}
  .ibtn.cal-btn{background:var(--orange);color:#1c1300}
  .notice{display:flex;gap:8px;align-items:flex-start}
  .notice>.ic{margin-top:5px;color:var(--orange);width:18px;height:18px}
  .bigic{width:60px;height:60px;border-radius:50%;background:#fff3e0;color:var(--orange);display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
  .bigic .ic{width:30px;height:30px}
  .me .av .ic{width:24px;height:24px}
  .dayinfo .ic{color:var(--navy)}
  .dayinfo .ic.bad{color:var(--warn)}
  .drawer-bg{position:fixed;inset:0;background:rgba(13,23,64,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:min(92vw,420px);background:var(--bg);z-index:61;transform:translateX(-105%);transition:transform .28s ease;display:flex;flex-direction:column;box-shadow:6px 0 24px rgba(13,23,64,.3)}
  .drawer.open{transform:none}
  .drawer-bg.open{opacity:1;pointer-events:auto}
  .dr-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff;border-bottom:3px solid var(--orange)}
  .dr-head b{display:flex;align-items:center;gap:8px;font-size:16px}
  .dr-head button{background:rgba(255,255,255,.14);color:#fff;padding:8px;display:flex}
  .dr-body{overflow-y:auto;padding:16px;flex:1}
  .dr-body .cal{animation:none;margin-bottom:0}
  @media print{body *{visibility:hidden}#slip,#slip *{visibility:visible}#slip{position:absolute;top:0;right:0;left:0;box-shadow:none}}
  .tot{margin-top:12px;background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff;border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--orange)}
  .tot b{font-size:22px;color:var(--orange)}
</style>

    e.style.animationDelay = (-Math.random() * 8) + 's';
    c.appendChild(e);
  }
})();
// عدّاد يطلّع الصافي من صفر للرقم الحقيقي
function countUp(){
  document.querySelectorAll('.big[data-v]').forEach(el => {
    const to = Number(el.dataset.v) || 0, t0 = performance.now(), dur = 1100;
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(to * e) + ' ج'; if(k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

// ===== تغيير كلمة السر =====
$('pwBtn').onclick = () => { ['pw0','pw1','pw2'].forEach(i => $(i).value = ''); $('pwMsg').textContent = ''; $('pwMdl').style.display = 'flex'; };
$('pwCancel').onclick = () => $('pwMdl').style.display = 'none';
$('pwSave').onclick = async () => {
  const m = $('pwMsg'), u = auth.currentUser, o = $('pw0').value, n = $('pw1').value;
  m.style.color = 'var(--warn)';
  if(!o) { m.textContent = 'اكتب كلمة السر الحالية.'; return; }
  if(n.length < 6){ m.textContent = 'الجديدة لازم 6 أحرف على الأقل.'; return; }
  if(n !== $('pw2').value){ m.textContent = 'كلمتين السر الجديدتين مش زي بعض.'; return; }
  try{
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, o));
    await u.updatePassword(n);
    m.style.color = 'var(--good)'; m.textContent = 'تم تغيير كلمة السر.';
    setTimeout(() => $('pwMdl').style.display = 'none', 1500);
  }catch(e){ m.textContent = /wrong-password|invalid-credential/.test(e.code || '') ? 'كلمة السر الحالية غلط.' : e.code === 'auth/too-many-requests' ? 'محاولات كتير، جرّب بعد شوية.' : 'تعذر التغيير، حاول تاني.'; }
};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const norm = v => String(v || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '');
$('go').onclick = async () => {
  $('msg').textContent = '';
  const nid = norm($('em').value);
  if(nid.length !== 14){ $('msg').textContent = 'الرقم القومي لازم يكون 14 رقم.'; return; }
  try{ await auth.signInWithEmailAndPassword(nid + '@workers.payroll.app', $('pw').value); }
  catch(e){ $('msg').textContent = 'الرقم القومي أو كلمة السر غير صحيحة.'; }
};
$('out').onclick = () => auth.signOut();
const drawer = open => { $('dr').classList.toggle('open', open); $('drBg').classList.toggle('open', open); $('dr').setAttribute('aria-hidden', open ? 'false' : 'true'); };
$('calBtn').onclick = () => drawer(true);
$('drClose').onclick = $('drBg').onclick = () => drawer(false);
document.addEventListener('keydown', e => { if(e.key === 'Escape') drawer(false); });

const line = (l, v, c) => '<div class="ln ' + (c||'') + '"><span>' + l + '</span><b>' + fmt(v) + ' ج</b></div>';

auth.onAuthStateChanged(async (user) => {
  if(!user){ $('loginView').style.display = 'flex'; $('appView').style.display = 'none'; return; }
  $('loginView').style.display = 'none'; $('appView').style.display = 'block';
  const box = $('list');
  try{
    const snap = await db.collection('payslips').where('email', '==', (user.email || '').toLowerCase()).get();
    const all = snap.docs.map(d => d.data()), prof = all.find(x => x._profile) || null;
    const items = all.filter(x => !x._profile).sort((a, b) => (b.month || '').localeCompare(a.month || ''));
    if(!items.length){ const n = new Date(); items.push({_empty: true, name: (prof && prof.name) || '', month: n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0'), label: 'كشف شهر ' + ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'][n.getMonth()] + ' ' + n.getFullYear() }); }
    const nm = items[0].name || (prof && prof.name) || user.displayName || '';
    const who = nm || ('رقم قومي ' + (user.email || '').split('@')[0]);
    $('waBtn').href = 'https://wa.me/201099747509?text=' + encodeURIComponent('السلام عليكم، أنا ' + who + '، عندي ملاحظة بخصوص ' + (items[0].label || 'كشف القبض') + ':\n');
    $('me').innerHTML = '<div class="me"><div class="av">' + ic('user') + '</div><div><div class="nm">' + esc(nm || 'أهلاً بيك') + '</div></div></div>';
    const ad = x => String(x).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    const hm = m => { m = Math.round(m || 0); const h = Math.floor(m / 60), mm = m % 60; return (h ? ad(h) + ' ساعة ' : '') + (mm ? (h ? 'و ' : '') + ad(mm) + ' دقيقة' : (h ? '' : '٠ دقيقة')); };
    const row = (label, val, sign) => { const n = Number(val) || 0; return '<div class="ln ' + (n ? (sign === '+' ? 'plus' : 'minus') : 'zero') + '"><span class="l">' + label + '</span><span class="v">' + sign + fmt(n) + ' ج</span></div>'; };
    const days = d => (d == null ? '' : ' (' + fmt(d) + ' يوم)');
    const mshort = p => String(p.label || p.month).replace('كشف شهر ', '');
    const slip = p => { const r = p.r || {};
      const sal = r.joinDay > 0 ? fmt(r.baseSalary) + ' ج (' + fmt(r.workedDays) + ' يوم)' : fmt(r.salary || r.baseSalary) + ' ج / شهرياً';
      return '<div class="pc" id="slip"><div class="pc-head"><span class="wn">' + esc(p.name) + '</span><span class="ws">' + sal + '</span></div><div class="pc-body">' +
        row('إضافي', r.overtimeAmount, '+') + row('إجازة رسمية' + days(r.holidayDays), r.holidayAmount, '+') + row('تأخير', r.lateAmount, '-') + row('سلف', r.advance, '-') +
        row('غياب' + days(r.countedAbsentDays), r.absentAmount, '-') + row('ترحيل', r.carryDeduct, '-') +
        row('خصومات' + (r.discount > 0 && r.discountReason ? ' (' + esc(r.discountReason) + ')' : ''), r.discount, '-') +
        '<div class="gt"><span>الصافي المستحق</span><span class="big" data-v="' + (Number(r.total) || 0) + '">' + fmt(r.total) + ' ج</span></div></div>' +
        '<div class="pc-foot">شركة الشافعي ستيل للصناعات الهندسية · ' + esc(p.label) + (r.carryRemaining > 0 ? '<br>متبقي مرحّل عليك: ' + fmt(r.carryRemaining) + ' ج' : '') + '</div></div>'; };
    const show = i => {
      const p = items[i], att0 = p.att && Object.keys(p.att).length ? p.att : null, att = att0 || {};
      $('months').innerHTML = items.length > 1 ? items.map((q, k) => '<button type="button" class="' + (k === i ? 'on' : '') + '" data-i="' + k + '">' + esc(mshort(q)) + '</button>').join('') : '';
      $('months').querySelectorAll('button').forEach(bt => bt.onclick = () => show(Number(bt.dataset.i)));
      const A = Object.values(att), absN = A.filter(x => x.s === 'a').length;
      let h = '<div class="notice">' + ic('pin') + '<div>عدد الأيام المسموح بالغياب فيها: <b>١ يوم</b> للأعذار المهمة.';
      if(att0) h += '<br>غيابك في ' + esc(mshort(p)) + ': <b>' + ad(absN) + ' ' + (absN === 1 ? 'يوم' : 'أيام') + '</b>' + (absN > 1 ? ' — الأيام الزيادة عن اليوم المسموح بتتخصم.' : (absN === 1 ? ' — استهلكت اليوم المسموح.' : ' — لسه معاك اليوم المسموح.'));
      h += '</div></div>';
      $('notice').innerHTML = h; h = '';
      {
        const [yy, mo] = p.month.split('-').map(Number), first = (new Date(yy, mo - 1, 1).getDay() + 1) % 7, dim = new Date(yy, mo, 0).getDate();
        const now = new Date(), tn = (now.getFullYear() === yy && now.getMonth() + 1 === mo) ? now.getDate() : 0;
        const sum = { pr: A.filter(x => x.s === 'p' || x.s === 'l').length, lt: A.reduce((s, x) => s + (x.l || 0), 0), ot: A.reduce((s, x) => s + (x.ot || 0), 0) };
        let g = ['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'].map(n => '<div class="dn">' + n + '</div>').join('') + '<div class="e"></div>'.repeat(first);
        for(let d = 1; d <= dim; d++) g += '<button type="button" class="d ' + (att[d] ? att[d].s : '') + (d === tn ? ' today' : '') + '" data-d="' + d + '">' + ad(d) + '</button>';
        h += '<div class="cal"><h3>' + ic('cal') + ' حضورك — ' + esc(mshort(p)) + '</h3><div class="sum"><div><b>' + ad(sum.pr) + '</b>يوم حضور</div><div><b>' + ad(absN) + '</b>يوم غياب</div><div><b style="font-size:12px">' + hm(sum.lt) + '</b>تأخير</div><div><b style="font-size:12px">' + hm(sum.ot) + '</b>إضافي</div></div>' +
          '<div class="sub">دوس على أي يوم تشوف تفاصيله</div><div class="cal-grid">' + g + '</div>' +
          '<div class="legend"><span><i style="background:#b9e4cf"></i>حضور</span><span><i style="background:#f6d9a8"></i>تأخير</span><span><i style="background:#f5beb8"></i>غياب</span><span><i style="background:#c3d2fb"></i>إجازة رسمية</span><span><i style="background:#dfe2ec"></i>راحة</span></div><div class="dayinfo" id="dayinfo">' + (att0 ? 'اختار يوم من التقويم.' : ic('cal') + ' حضورك وانصرافك هيظهروا هنا أول ما الإدارة تحدّث بياناتك.') + '</div></div>';
      }
      $('cal').innerHTML = h;
      $('cal').querySelectorAll('button.d').forEach(bt => bt.onclick = () => {
        $('cal').querySelectorAll('button.d.sel').forEach(x => x.classList.remove('sel')); bt.classList.add('sel');
        const [yy, mo] = p.month.split('-').map(Number), d = Number(bt.dataset.d), a = att[d];
        const t = new Date(yy, mo - 1, d).toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long'});
        let body = !a ? 'لسه مفيش تسجيل لليوم ده.' : a.s === 'h' ? ic('star') + ' إجازة رسمية.' : a.s === 'f' ? ic('sun') + ' يوم راحة أسبوعية.' : a.s === 'a' ? ic('xcircle', 'bad') + ' غياب — مفيش حضور مسجّل في اليوم ده.' : (a.i ? ic('clock') + ' حضور: <b>' + ad(a.i) + '</b>' + (a.o ? ' &nbsp;←&nbsp; انصراف: <b>' + ad(a.o) + '</b>' : ' &nbsp;(لسه مسجلش انصراف)') : ic('check') + ' حضور.');
        if(a && (a.s === 'p' || a.s === 'l')){ if(a.l) body += '<br>' + ic('alert', 'bad') + ' تأخير / خروج بدري: <b>' + hm(a.l) + '</b>'; if(a.ot) body += '<br>' + ic('plus') + ' إضافي: <b>' + hm(a.ot) + '</b>'; }
        $('dayinfo').innerHTML = '<div class="t">' + esc(t) + '</div>' + body;
      });
      if(p._empty){ box.innerHTML = '<div class="card" style="text-align:center;padding:26px 20px"><div class="bigic">' + ic('wallet') + '</div><div style="font-weight:bold;color:var(--navy);margin:6px 0">المرتب قيد التحقق</div><div class="spin" role="status" aria-label="جاري التحميل"></div></div>'; countUp(); return; }
      box.innerHTML = slip(p) + '<div class="acts"><button type="button" class="o" id="shareBtn">' + ic('camera') + ' حفظ / مشاركة كصورة</button><button type="button" id="printBtn">' + ic('printer') + ' طباعة / PDF</button></div>';
      $('printBtn').onclick = () => { fixTotals(); window.print(); };
      $('shareBtn').onclick = async () => {
        const el = $('slip'); fixTotals(); el.classList.add('snap');
        try{
          const cv = await html2canvas(el, {scale: 2, backgroundColor: '#ffffff'});
          const blob = await new Promise(r => cv.toBlob(r, 'image/png')), f = new File([blob], 'payslip-' + p.month + '.png', {type: 'image/png'});
          if(navigator.canShare && navigator.canShare({files: [f]})) await navigator.share({files: [f], title: p.label});
          else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = f.name; a.click(); }
        }catch(e){ if(e && e.name !== 'AbortError') alert('تعذر حفظ الصورة، جرّب زرار الطباعة / PDF.'); }
        el.classList.remove('snap');
      };
      countUp();
    };
    const fixTotals = () => document.querySelectorAll('.big[data-v]').forEach(el => el.textContent = fmt(Number(el.dataset.v)) + ' ج');
    show(0);
  }catch(e){ box.innerHTML = '<div class="card">تعذر تحميل الكشوف.</div>'; }
});
</script>
